name: CI

on:
  push:
    branches: [main, next]
  pull_request:

# Each push run has a separate group, so no run from a push to next or main is ever
# cancelled. A newer commit on a pull request cancels that pull request's earlier run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    # The push to this repository's next already runs CI on the commit its pull request
    # shows, so that pull request's run is skipped. Every push, and any other pull
    # request, a fork's next among them, runs.
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    # A main commit of integrations until its release; then the release tag.
    # That commit sets GOTOOLCHAIN for Go 1.27.3, which go.mod requires.
    uses: qoryai/integrations/.github/workflows/go.yml@f5bc79a410348ce50d42979166f456adcf93b798
